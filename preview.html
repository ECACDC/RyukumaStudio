<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ryukuma Studios</title>
<style>
:root{--bg:#0b0b0d;--surface:#131316;--text:#f4f4f5;--muted:#9b9ba3;--line:rgba(255,255,255,.09);--accent:#7c3aed}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.shell{width:min(1120px,calc(100% - 40px));margin:auto}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;gap:10px;align-items:center;font-size:13px;font-weight:800;letter-spacing:.08em}
.mark{display:grid;width:32px;height:32px;place-items:center;border-radius:8px;background:var(--accent);color:#fff;font-weight:900}
.navText{font-size:13px;color:var(--muted)}.storeHeader{padding:48px 0 26px}.storeHeader h1{margin:0 0 7px;font-size:36px;letter-spacing:-.035em}.storeHeader p{margin:0;color:var(--muted);font-size:14px}
.catalog{padding:12px 0 80px}.assetGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.assetPreview{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#08080a}
.assetPreview video{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}
.assetOverlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:16px;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.04) 62%);opacity:0;transition:.18s}
.assetCard:hover .assetOverlay{opacity:1}.assetCard:hover video{transform:scale(1.025);filter:brightness(.72)}
.assetName{font-size:18px;font-weight:800}.assetPrice{margin-top:3px;color:#d4d4d8;font-size:14px}.assetArrow{font-size:22px}
footer{min-height:110px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);color:#71717a;font-size:11px}
@media(max-width:560px){.shell{width:min(100% - 24px,1120px)}.assetGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.assetOverlay{opacity:1;padding:12px}.assetName{font-size:15px}.assetPrice{font-size:12px}}
</style>
</head>
<body>
<header class="nav shell">
  <div class="brand"><span class="mark">R</span><span>RYUKUMA STUDIOS</span></div>
  <span class="navText">Roblox Assets</span>
</header>
<section class="storeHeader shell">
  <h1>Assets</h1>
  <p>Browse Roblox systems, packs, and assets.</p>
</section>
<section class="catalog shell">
  <div class="assetGrid">
    <a class="assetCard" href="./combat-system.html">
      <div class="assetPreview">
        <video src="./public/combat-system-demo.mp4" muted playsinline preload="metadata"></video>
        <div class="assetOverlay">
          <div><div class="assetName">Combat System</div><div class="assetPrice">$5.99</div></div>
          <span class="assetArrow">→</span>
        </div>
      </div>
    </a>
  </div>
</section>
<footer class="shell">
  <div class="brand"><span class="mark">R</span><span>RYUKUMA STUDIOS</span></div>
  <p>© 2026 Ryukuma Studios</p>
</footer>
</body>
</html>
